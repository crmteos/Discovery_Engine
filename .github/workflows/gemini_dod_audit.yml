name: Gemini CLI DoD Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dod-audit:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh {0}

    steps:
      - name: 📚 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest py_compile

      - name: 🔍 Run Gemini CLI Audit (Local Mode)
        run: |
          python scripts/gemini_cli_audit.py --local
        env:
          # GEMINI_API_KEY is optional - falls back to static rules if not set
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: ✅ Validate Python Syntax
        run: |
          python -m py_compile scripts/gemini_cli_audit.py
          python -m py_compile tests/integration/test_gemini_cli_audit.py
          echo "All scripts validated successfully"

      - name: 📄 Generate Audit Report
        run: |
          echo "=== Gemini CLI DoD Audit Summary ==="
          echo "Phase: Phase 41 - v5.0.0"
          echo "Check: Zero paid APIs, pure Python fallbacks, W3C PROV-O compliance"
          echo "Status: Completed on $(date -u)"